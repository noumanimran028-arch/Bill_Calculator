<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Billing system Dashboard</title>
    </head>
    <body>
        <div class="form-container">
            <input id="Name1" type="text" placeholder="Enter customer name..." />

            <div class="product-inputs">
                <input id="Product1" type="text" placeholder="Enter product name..." />
                <input id="Quant1" type="text" placeholder="Enter quantity..." />
                <input id="Price1" type="number" placeholder="Enter price..." />
            </div>

            <div class="buttons">
                <button onclick="addProducts()">+ Add</button>
                <button onclick="finalBill()">Final Bill</button>
            </div>

            <a href="GetData.html">Go to show</a>
        </div>
        <div id="show1"></div>
        <script>
            //let customerName = prompt("Enter customer name");
            //let Name1 = document.querySelector("#Name1").value;
            let Products = [];

            function addProducts() {
                let name = document.querySelector("#Product1").value;
                let quant = document.querySelector("#Quant1").value;
                let price = document.querySelector("#Price1").value;
                let total = parseFloat(quant) * Number(price);
                let productsData = {
                    product1: name,
                    quant1: quant,
                    price1: price,
                    total: total
                };

                Products.push(productsData);
                let show1 = document.querySelector("#show1");

                show1.innerHTML += `
            <table class="bill-table">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Product Quantity</th>
                <th>Product Price</th>
                <th>Total Bill</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>${productsData.product1}</td>
                <td>${productsData.quant1}</td>
                <td>${productsData.price1}</td>
                <td>${productsData.total}</td>
            </tr>
        </tbody>
    </table>
`;
            }

            async function finalBill() {
                let Name1 = document.querySelector("#Name1").value;
                const billData = {
                    customerName: Name1,
                    products: Products
                };
                console.log(billData);
                const response = await fetch("https://6a80061eec7a640e63ab875c.mockapi.io/user/user", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(billData)
                });

                const data = await response.json();

                //console.log(data);
            }
        </script>
    </body>
</html>
